[workspace]
resolver = "2"
members = [
  "crates/flowly-script",
  "crates/flowly-align",
  "crates/flowly-asr",
  "crates/flowly-store",
  "crates/flowly-wasm",
  "apps/align-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
